[databases]
todosync = host=postgres port=5432 dbname=todosync

[pgbouncer]
listen_addr = 0.0.0.0
listen_port = 6432
auth_type = scram-sha-256
auth_file = /etc/pgbouncer/userlist.txt

; Transaction mode: mỗi transaction dùng 1 server connection, release ngay sau khi xong
pool_mode = transaction

; 3 app × ~300 concurrent requests = 900 → pool_size 300 để handle
; PostgreSQL max_connections=500 → safe
default_pool_size = 300
min_pool_size = 30
max_client_conn = 15000
reserve_pool_size = 50
reserve_pool_timeout = 2

server_connect_timeout = 10
server_idle_timeout = 120
server_lifetime = 3600
client_idle_timeout = 60
client_login_timeout = 15
query_timeout = 0
query_wait_timeout = 60

max_prepared_statements = 0

log_connections = 0
log_disconnections = 0
log_pooler_errors = 1
stats_period = 60

ignore_startup_parameters = extra_float_digits,options
