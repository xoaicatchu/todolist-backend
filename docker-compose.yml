services:
  # ==================== DATABASE ====================
  postgres:
    image: postgres:16-alpine
    container_name: todosync-postgres
    environment:
      POSTGRES_DB: todosync
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_INITDB_ARGS: "-E UTF8"
    command: ["postgres", "-c", "max_connections=500", "-c", "shared_buffers=256MB", "-c", "effective_cache_size=512MB"]
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./TodoSync.Api/Migrations:/docker-entrypoint-initdb.d
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U postgres" ]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - todosync-network

  # ==================== CONNECTION POOLER ====================
  pgbouncer:
    build: ./pgbouncer
    container_name: todosync-pgbouncer
    ports:
      - "6432:6432"
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - todosync-network

  # ==================== APP INSTANCES ====================
  app1:
    build: .
    container_name: todosync-app1
    environment:
      APP_PORT: "3000"
      ASPNETCORE_ENVIRONMENT: Development
    depends_on:
      pgbouncer:
        condition: service_started
      redis:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    networks:
      - todosync-network

  app2:
    build: .
    container_name: todosync-app2
    environment:
      APP_PORT: "3000"
      ASPNETCORE_ENVIRONMENT: Development
    depends_on:
      pgbouncer:
        condition: service_started
      redis:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    networks:
      - todosync-network

  app3:
    build: .
    container_name: todosync-app3
    environment:
      APP_PORT: "3000"
      ASPNETCORE_ENVIRONMENT: Development
    depends_on:
      pgbouncer:
        condition: service_started
      redis:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    networks:
      - todosync-network

  # ==================== LOAD BALANCER ====================
  nginx:
    image: nginx:alpine
    container_name: todosync-nginx
    ports:
      - "8080:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - app1
      - app2
      - app3
    networks:
      - todosync-network

  # ==================== CACHE ====================
  redis:
    image: redis:7.4-alpine
    container_name: todosync-redis
    ports:
      - "6379:6379"
    command: redis-server --appendonly yes --maxmemory 512mb --maxmemory-policy allkeys-lru
    volumes:
      - redis_data:/data
    healthcheck:
      test: [ "CMD", "redis-cli", "ping" ]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - todosync-network

  # ==================== MESSAGE BROKER ====================
  rabbitmq:
    image: rabbitmq:3.13-management-alpine
    container_name: todosync-rabbitmq
    environment:
      RABBITMQ_DEFAULT_USER: guest
      RABBITMQ_DEFAULT_PASS: guest
    ports:
      - "5672:5672" # AMQP
      - "15672:15672" # Management UI
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
    healthcheck:
      test: [ "CMD", "rabbitmq-diagnostics", "ping" ]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - todosync-network

  # ==================== OBSERVABILITY - PROMETHEUS ====================
  prometheus:
    image: prom/prometheus:v2.52.0
    container_name: todosync-prometheus
    extra_hosts:
      - "host.docker.internal:host-gateway"
    ports:
      - "9090:9090"
    volumes:
      - ./observability/prometheus.yml:/etc/prometheus/prometheus.yml
      - prometheus_data:/prometheus
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--web.console.libraries=/etc/prometheus/console_libraries'
      - '--web.console.templates=/etc/prometheus/consoles'
      - '--storage.tsdb.retention.time=30d'
    networks:
      - todosync-network

  # ==================== OBSERVABILITY - GRAFANA ====================
  grafana:
    image: grafana/grafana:11.4.0
    container_name: todosync-grafana
    ports:
      - "3001:3000"
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: admin
      GF_INSTALL_PLUGINS: grafana-piechart-panel
    volumes:
      - grafana_data:/var/lib/grafana
      - ./observability/grafana/provisioning:/etc/grafana/provisioning
      - ./observability/grafana/dashboards:/var/lib/grafana/dashboards
    depends_on:
      - prometheus
    networks:
      - todosync-network

  # ==================== DATABASE ADMIN UI ====================
  pgadmin:
    image: dpage/pgadmin4:8.14
    container_name: todosync-pgadmin
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@todosync.local
      PGADMIN_DEFAULT_PASSWORD: admin
      PGADMIN_CONFIG_SERVER_MODE: 'False'
    ports:
      - "5050:80"
    volumes:
      - pgadmin_data:/var/lib/pgadmin
    depends_on:
      - postgres
    networks:
      - todosync-network

networks:
  todosync-network:
    driver: bridge

volumes:
  postgres_data:
  redis_data:
  rabbitmq_data:
  prometheus_data:
  grafana_data:
  pgadmin_data:
